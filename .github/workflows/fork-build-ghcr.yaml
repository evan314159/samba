name: Fork Build to GHCR

# Builds the samba-server image with this branch's streams_xattr and pushes it to GHCR so a
# patched build can be deployed to the cluster. Not for upstream.

on:
  workflow_dispatch: {}
  push:
    branches:
      - streams-xattr-compat-4.24-ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    # A full samba RPM build.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # An immutable tag, so that GitOps sees a change on every rebuild.
      - name: Compute image tag
        id: tag
        run: echo "tag=xattr-compat-${GITHUB_SHA::10}" >> "$GITHUB_OUTPUT"

      # The branch as the spec's Source0 (see .github/fork-build/Dockerfile).
      - name: Archive the source
        run: |
          git archive --format=tar --prefix=samba-4.24.7/ HEAD |
            xz -T0 > .github/fork-build/samba-4.24.7.tar.xz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN could not create packages from the cilium fork, so a PAT
      # with write:packages is stored as the GHCR_TOKEN secret.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Test
        uses: docker/build-push-action@v6
        with:
          context: .github/fork-build
          # Only the arch of the cluster, to keep build times down.
          platforms: linux/amd64
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .github/fork-build
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/samba-server:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
